<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PS2010 Workshop Code Book</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #23363b; background: #f8fbfa; }
    body { margin: 0; display: grid; grid-template-columns: minmax(220px, 25%) 1fr; min-height: 100vh; }

    p { line-height: 1.65; }
    @media (max-width: 680px) { body { display: block; } aside { padding: 1rem 1.5rem; } main { padding: 1.5rem; } }
  </style>
</head>
<body>
  <aside><strong>PS2010 Workshop Code Book</strong><p>Workshop materials will appear here.</p></aside>
  <main><h1>Welcome to PS2010</h1><p>The new workshop code book is being prepared. The first Bookdown build will replace this holding page with the searchable workshop site.</p><p>In the meantime, visit the <a href="https://luke-kendrick.github.io/ps2010_codebook_25/">2025 code book</a>.</p></main>
